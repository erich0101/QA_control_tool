services:
  app:
    build: .
    restart: always
    environment:
      PORT: 3001
      NODE_ENV: production
    volumes:
      - app_uploads:/app/uploads
    ports:
      - "8088:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  app_uploads:
