<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual QA Tool | JIRA Edition</title>
    <meta name="description" content="Herramienta de QA Manual con gestión de proyectos, casos de uso, test suites y evidencias">
    <link rel="stylesheet" href="css/main.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧪</text></svg>">
</head>
<body>
    <div id="login-screen" class="login-screen">
        <div class="login-card">
            <h2 class="login-title">🔐 Autenticación</h2>
            <form id="login-form">
                <div class="login-field">
                    <label class="login-label" for="login-email">Email</label>
                    <input type="email" id="login-email" required class="login-input" placeholder="tu@email.com">
                </div>
                <div class="login-field-group">
                    <label class="login-label" for="login-password">Contraseña</label>
                    <input type="password" id="login-password" required class="login-input" placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary login-btn-full">Iniciar Sesión</button>
            </form>
        </div>
    </div>

    <div id="app" class="app">
        <header id="topbar" class="topbar"></header>
        <nav id="tabbar" class="tabbar"></nav>
        <main id="tab-content" class="tab-content"></main>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
